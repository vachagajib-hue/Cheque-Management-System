<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สแกนเช็ค — ทะเบียนเช็คสั่งจ่าย</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#F3F0FA;color:#222;font-size:15px}
header{background:#3A1F6E;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:18px;font-weight:700}
header .sub{font-size:12px;opacity:.75;margin-top:3px}
.back-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:'Sarabun',sans-serif;text-decoration:none}
.back-btn:hover{background:rgba(255,255,255,.25)}
.wrap{max-width:560px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:20px;margin-bottom:16px}
.dropzone{border:2px dashed #C9BFEA;border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:background .15s}
.dropzone:hover{background:#F8F7FF}
.dropzone .icon{font-size:34px}
.dropzone p{font-size:13px;color:#666;margin-top:8px}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif}
.btn-primary{background:#3A1F6E;color:#fff}
.btn-primary:hover{background:#2D1760}
.btn-primary:disabled{background:#B3A9D6;cursor:not-allowed}
.btn-success{background:#0F9D58;color:#fff;width:100%;padding:12px;font-size:15px}
.btn-success:hover{background:#0C7C46}
.btn-success:disabled{background:#9BCFB0;cursor:not-allowed}
.btn-outline{background:#fff;border:1.5px solid #3A1F6E;color:#3A1F6E}
.btn-outline:hover{background:#F8F7FF}
.preview-wrap{text-align:center;margin-bottom:14px}
.preview-wrap img{max-width:100%;max-height:280px;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field-grid .full{grid-column:1/-1}
.field label{display:block;font-size:12px;color:#666;margin-bottom:4px;font-weight:600}
.field input{width:100%;padding:9px 10px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:'Sarabun',sans-serif}
.field input:focus{outline:none;border-color:#3A1F6E}
.confidence{font-size:12px;font-weight:600;margin-bottom:14px}
.conf-high{color:#0F9D58}
.conf-medium{color:#B7791F}
.conf-low{color:#C53030}
.status-box{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px;display:none}
.status-info{background:#EBF8FF;color:#2B6CB0;display:block}
.status-error{background:#FFF5F5;color:#C53030;display:block}
.status-success{background:#F0FFF4;color:#22543D;display:block}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.15);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:#888;margin-top:6px}
.action-row{display:flex;gap:10px;margin-top:8px}
.action-row .btn{flex:1}
a.file-link{color:#1565C0;text-decoration:none;font-weight:600}
</style>
</head>
<body>

<header>
  <div>
    <h1>📷 สแกนเช็ค</h1>
    <div class="sub">ถ่ายรูปหรืออัปโหลดรูปเช็ค ระบบจะอ่านข้อมูลให้อัตโนมัติ</div>
  </div>
  <a class="back-btn" href="dashboard.html">← กลับ Dashboard</a>
</header>

<div class="wrap">

  <!-- ขั้นที่ 1: เลือก/ถ่ายรูป -->
  <div class="card" id="card-upload">
    <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📷</div>
      <p>แตะเพื่อถ่ายรูป หรือเลือกไฟล์รูปเช็ค</p>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
  </div>

  <!-- ขั้นที่ 2: พรีวิว + วิเคราะห์ -->
  <div class="card" id="card-preview" style="display:none">
    <div class="preview-wrap">
      <img id="previewImg" src="">
    </div>
    <div id="statusBox" class="status-box"></div>
    <button class="btn btn-primary" id="btnAnalyze" style="width:100%" onclick="analyzeImage()">🔍 วิเคราะห์เช็ค (OCR)</button>
    <div class="hint" style="text-align:center">ถ่ายให้เห็นเลขที่เช็คแถวล่างสุดชัดเจน (ตัวเลข MICR)</div>
  </div>

  <!-- ขั้นที่ 3: ผลลัพธ์ OCR แก้ไขได้ + บันทึก -->
  <div class="card" id="card-result" style="display:none">
    <p style="font-size:12px;color:#888;margin-bottom:10px">ผลลัพธ์จากการอ่านเช็ค (ตรวจสอบ/แก้ไขก่อนบันทึก)</p>
    <div class="field-grid">
      <div class="field"><label>เลขที่เช็ค</label><input id="f-checkno"></div>
      <div class="field"><label>ธนาคาร</label><input id="f-bank"></div>
      <div class="field"><label>จำนวนเงิน</label><input id="f-amount"></div>
      <div class="field"><label>วันที่ (DD/MM/YYYY)</label><input id="f-date"></div>
      <div class="field full"><label>ผู้รับเงิน</label><input id="f-payee"></div>
    </div>
    <div class="confidence" id="confidenceLabel"></div>
    <div id="saveStatusBox" class="status-box"></div>
    <button class="btn btn-success" id="btnSave" onclick="saveCheck()">✅ บันทึกเช็คนี้</button>
    <div class="action-row">
      <button class="btn btn-outline" onclick="resetScan()">↺ สแกนใบใหม่</button>
    </div>
  </div>

</div>

<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxej2efdZ6h2B9Hab0YJ7Opgc85UrQFhQ3WVoWRf9BrKG5m5imH2PasmFgnzQOKAyfa/exec";

var currentBase64 = null;
var currentMime = null;

document.getElementById("fileInput").addEventListener("change", function(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  currentMime = file.type || "image/jpeg";
  var reader = new FileReader();
  reader.onload = function(ev){
    var dataUrl = ev.target.result;
    currentBase64 = dataUrl.split(",")[1];
    document.getElementById("previewImg").src = dataUrl;
    document.getElementById("card-upload").style.display = "none";
    document.getElementById("card-preview").style.display = "block";
    document.getElementById("card-result").style.display = "none";
    setStatus("statusBox", "", "");
  };
  reader.readAsDataURL(file);
});

function setStatus(elId, type, html){
  var el = document.getElementById(elId);
  if(!type){ el.style.display = "none"; el.innerHTML = ""; return; }
  el.className = "status-box status-" + type;
  el.innerHTML = html;
}

function postToScript(payload){
  return new Promise(function(resolve, reject){
    var xhr = new XMLHttpRequest();
    xhr.open("POST", SCRIPT_URL, true);
    // ใช้ text/plain เพื่อเลี่ยง CORS preflight (Apps Script เว็บแอปไม่รองรับ doOptions)
    // ฝั่ง Code.gs อ่านด้วย JSON.parse(e.postData.contents) อยู่แล้ว ไม่สนใจ Content-Type จริง
    xhr.setRequestHeader("Content-Type", "text/plain;charset=utf-8");
    xhr.timeout = 60000;
    xhr.onreadystatechange = function(){
      if(xhr.readyState !== 4) return;
      try{
        var data = JSON.parse(xhr.responseText);
        resolve(data);
      }catch(e){
        reject(new Error("อ่านผลลัพธ์ไม่ได้: " + e.message));
      }
    };
    xhr.ontimeout = function(){ reject(new Error("หมดเวลาเชื่อมต่อ")); };
    xhr.onerror = function(){ reject(new Error("เชื่อมต่อไม่สำเร็จ")); };
    xhr.send(JSON.stringify(payload));
  });
}

function analyzeImage(){
  if(!currentBase64) return;
  var btn = document.getElementById("btnAnalyze");
  btn.disabled = true;
  btn.textContent = "กำลังวิเคราะห์...";
  setStatus("statusBox", "info", "<span class='spinner'></span>กำลังอ่านข้อมูลจากรูปเช็ค...");

  postToScript({action:"ocr", image: currentBase64, mime: currentMime})
    .then(function(data){
      btn.disabled = false;
      btn.textContent = "🔍 วิเคราะห์เช็ค (OCR)";
      if(!data.success){
        setStatus("statusBox", "error", "อ่านไม่สำเร็จ: " + (data.error || "ไม่ทราบสาเหตุ") + " — ลองถ่ายรูปใหม่ให้ชัดขึ้น");
        return;
      }
      setStatus("statusBox", "success", "อ่านข้อมูลสำเร็จ — ตรวจสอบความถูกต้องด้านล่างก่อนบันทึก");
      document.getElementById("f-checkno").value = data.check_no || "";
      document.getElementById("f-bank").value = data.bank || "";
      document.getElementById("f-amount").value = data.amount || "";
      document.getElementById("f-date").value = data.date || "";
      document.getElementById("f-payee").value = data.payee || "";
      var confEl = document.getElementById("confidenceLabel");
      var confMap = {high:["สูง","conf-high"], medium:["ปานกลาง","conf-medium"], low:["ต่ำ — กรุณาตรวจสอบตัวเลขให้ดี","conf-low"]};
      var c = confMap[(data.confidence||"").toLowerCase()] || ["ไม่ทราบ","conf-medium"];
      confEl.textContent = "ความมั่นใจในการอ่าน: " + c[0];
      confEl.className = "confidence " + c[1];
      setStatus("saveStatusBox", "", "");
      document.getElementById("card-result").style.display = "block";
    })
    .catch(function(err){
      btn.disabled = false;
      btn.textContent = "🔍 วิเคราะห์เช็ค (OCR)";
      setStatus("statusBox", "error", "เกิดข้อผิดพลาด: " + err.message);
    });
}

function saveCheck(){
  var checkNo = document.getElementById("f-checkno").value.trim();
  var bank    = document.getElementById("f-bank").value.trim();
  var amount  = document.getElementById("f-amount").value.trim();
  var date    = document.getElementById("f-date").value.trim();
  var payee   = document.getElementById("f-payee").value.trim();

  if(!checkNo){
    setStatus("saveStatusBox", "error", "กรุณาระบุเลขที่เช็คก่อนบันทึก");
    return;
  }

  var filename = (checkNo || "unknown") + "_" + (bank || "unknown") + ".jpg";
  var btn = document.getElementById("btnSave");
  btn.disabled = true;
  btn.textContent = "กำลังบันทึก...";
  setStatus("saveStatusBox", "info", "<span class='spinner'></span>กำลังบันทึกรูปเช็คและเชื่อมกับทะเบียน...");

  postToScript({
    action: "save",
    image: currentBase64,
    mime: currentMime,
    data: {
      check_no: checkNo,
      bank: bank,
      amount: amount,
      date: date,
      payee: payee,
      filename: filename
    }
  }).then(function(res){
    btn.disabled = false;
    btn.textContent = "✅ บันทึกเช็คนี้";
    if(!res.success){
      setStatus("saveStatusBox", "error", "บันทึกไม่สำเร็จ: " + (res.error || "ไม่ทราบสาเหตุ"));
      return;
    }
    if(res.linked){
      setStatus("saveStatusBox", "success", "บันทึกสำเร็จ และเชื่อมรูปเข้ากับทะเบียนเช็คเลขที่ " + escapeHtml(checkNo) + " แล้ว — <a class='file-link' href='" + res.fileUrl + "' target='_blank'>เปิดดูรูป</a>");
    } else {
      setStatus("saveStatusBox", "error", "บันทึกรูปลง Drive สำเร็จ แต่ไม่พบเลขที่เช็ค \"" + escapeHtml(checkNo) + "\" ในทะเบียน — กรุณาตรวจสอบเลขที่เช็คหรือเพิ่มแถวในชีตก่อน แล้วลองซ่อมลิงก์ทีหลัง (<a class='file-link' href='" + res.fileUrl + "' target='_blank'>เปิดดูรูปที่อัปโหลดแล้ว</a>)");
    }
  }).catch(function(err){
    btn.disabled = false;
    btn.textContent = "✅ บันทึกเช็คนี้";
    setStatus("saveStatusBox", "error", "เกิดข้อผิดพลาด: " + err.message);
  });
}

function resetScan(){
  currentBase64 = null;
  currentMime = null;
  document.getElementById("fileInput").value = "";
  document.getElementById("previewImg").src = "";
  document.getElementById("card-upload").style.display = "block";
  document.getElementById("card-preview").style.display = "none";
  document.getElementById("card-result").style.display = "none";
  setStatus("statusBox", "", "");
  setStatus("saveStatusBox", "", "");
}

function escapeHtml(s){
  return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
</script>

</body>
</html>
